[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Local R&D harness for AI pipeline steps (clustering, filtering, classification, etc.)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0,<1",
  "google-genai>=1.16.0,<2",
  "groq>=0.22.0,<1",
  "openai>=1.68.0,<2",
  "pydantic>=2.10.0,<3",
  "python-dotenv>=1.0.1,<2",
  "tiktoken>=0.9.0,<1",
  "pypdf>=5.4.0,<6",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "ruff>=0.9.6,<0.10",
]
ui = [
  "streamlit>=1.41.0,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]

[tool.pytest.ini_options]
testpaths = [
  "common/tests",
  "clustering/tests",
  "filtering/tests",
  "classification/tests",
  "generation/tests",
  "context_pipeline/decompose/tests",
  "context_pipeline/extract/tests",
  "context_pipeline/classify_claims/tests",
  "ui/tests",
]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
