[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Local R&D harness for AI pipeline steps (Streamlit UI, fixtures, local results)"
requires-python = ">=3.11"
dependencies = [
  "document-pipeline-core",
  "anthropic>=0.49.0,<1",
  "google-genai>=1.16.0,<2",
  "groq>=0.22.0,<1",
  "openai>=2.7.2,<3",
  "pydantic>=2.10.0,<3",
  "python-dotenv>=1.0.1,<2",
  "tiktoken>=0.9.0,<1",
  "pdfplumber>=0.11.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "ruff>=0.9.6,<0.10",
  "reportlab>=4.2.0,<5",
]
ui = [
  "streamlit>=1.41.0,<2",
]

[tool.uv.sources]
document-pipeline-core = { path = "../shared/document_pipeline_core", editable = true }

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["ui/tests", "harness/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
