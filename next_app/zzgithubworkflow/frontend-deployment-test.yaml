name: Deploy to Test Environment

on:
    push:
        branches:
            - develop # Deploy to test when code is pushed to develop branch
    workflow_dispatch: # Allow manual trigger

env:
    GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    SERVICE_NAME: medwebapp-frontend-container-test
    REGION: us-east1
    NODE_ENV: test

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v1
              with:
                  project_id: ${{ env.GCP_PROJECT_ID }}
                  service_account_key: ${{ secrets.GCP_SA_KEY }}
                  export_default_credentials: true

            - name: Configure Docker to use Google Cloud
              run: gcloud auth configure-docker

            - name: Build and push Docker image
              working-directory: ./next_app # This specifies to work in the Next.js directory
              run: |
                  docker build \
                    --build-arg NODE_ENV=${{ env.NODE_ENV }} \
                    --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
                    --tag gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
                    .
                  docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

            - name: Deploy to Cloud Run (Test)
              uses: google-github-actions/deploy-cloudrun@v1
              with:
                  service: ${{ env.SERVICE_NAME }}
                  image: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
                  region: ${{ env.REGION }}
                  env_vars: |
                      NODE_ENV=${{ env.NODE_ENV }}
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
                  flags: "--allow-unauthenticated"
