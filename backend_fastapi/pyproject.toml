[project]
name = "backend-fastapi"
version = "0.1.0"
description = "FastAPI migration app for the medical backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.13.3,<2",
  "asyncpg>=0.30.0,<1",
  "cryptography>=45.0.0,<46",
  "document-pipeline-core",
  "fastapi>=0.136.1,<0.137",
  "google-auth>=2.38.0,<3",
  "google-genai>=1.55.0,<2",
  "google-cloud-speech>=2.38.0",
  "google-cloud-storage>=2.19.0,<4",
  "google-cloud-tasks>=2.22.0",
  "httpx>=0.28.0,<1",
  "markdown-it-py>=4.0.0,<5",
  "opentelemetry-api>=1.27.0,<2",
  "opentelemetry-exporter-gcp-trace>=1.7.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<0.60",
  "opentelemetry-instrumentation-httpx>=0.48b0,<0.60",
  "opentelemetry-sdk>=1.27.0,<2",
  "psycopg2-binary>=2.9.10,<3",
  "pydantic-settings>=2.7.0,<3",
  "pyjwt>=2.10.1,<3",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "sqlparse>=0.5.5",
  "transcription-contract",
  "uvicorn[standard]>=0.34.0,<0.35",
]

[tool.uv.sources]
document-pipeline-core = { path = "../shared/document_pipeline_core", editable = true }
transcription-contract = { path = "../shared/transcription_contract", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.14.0,<0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"
