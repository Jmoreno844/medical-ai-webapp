[project]
name = "transcription-worker"
version = "0.1.0"
description = "Cloud Run worker for VextHealth segmented audio transcription"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "google-auth>=2.38.0,<3",
  "google-cloud-storage>=2.19.0,<4",
  "google-genai>=1.55.0,<2",
  "httpx>=0.28.0,<0.29",
  "numpy>=2.0.0,<3",
  "opentelemetry-api>=1.27.0,<2",
  "opentelemetry-exporter-gcp-trace>=1.7.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<0.60",
  "opentelemetry-instrumentation-httpx>=0.48b0,<0.60",
  "opentelemetry-sdk>=1.27.0,<2",
  "onnxruntime>=1.20.0,<2",
  "pydantic-settings>=2.8.0,<3",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.20,<0.1",
  "transcription-contract",
  "worker-runtime",
  "uvicorn[standard]>=0.34.0,<0.35",
]

[tool.uv.sources]
transcription-contract = { path = "../shared/transcription_contract", editable = true }
worker-runtime = { path = "../shared/worker_runtime", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.14.0,<0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
