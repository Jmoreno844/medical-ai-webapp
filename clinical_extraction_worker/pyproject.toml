[project]
name = "clinical-extraction-worker"
version = "0.1.0"
description = "Cloud Run worker for shadow clinical fact extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "google-auth>=2.38.0,<3",
  "google-genai>=1.55.0,<2",
  "httpx>=0.28.0,<0.29",
  "openai>=1.99.9,<2",
  "pydantic-settings>=2.8.0,<3",
  "python-dotenv>=1.0.1,<2",
  "uvicorn[standard]>=0.34.0,<0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.25.0,<1",
  "ruff>=0.14.0,<0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
