name: Backend Test and Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deployment-test.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables de GCP viven en el GitHub Environment "stg" (no en repo-level vars).
# Cada job que despliega debe declarar environment: stg para que vars.* se resuelva.

permissions:
  contents: read
  id-token: write

