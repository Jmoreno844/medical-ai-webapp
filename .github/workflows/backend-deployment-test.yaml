  build-and-push:
    name: Build and Push Docker Image
    # needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: stg
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-backend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: django-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Tag with latest for caching
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-backend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: django-backend

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --ingress=all
            --allow-unauthenticated
            --session-affinity
            --service-account=${{ vars.BACKEND_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=1
            --concurrency=250
          env_vars: |
            DJANGO_SETTINGS_MODULE=config.settings.test
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            ENVIRONMENT=test
            ENABLE_SILK=true
            INSTANCE_CONNECTION_NAME=${{ vars.INSTANCE_CONNECTION_NAME }}
            GENERATE_DOCUMENT_CLOUD_FUNCTION_URL=${{ vars.GENERATE_DOCUMENT_CLOUD_FUNCTION_URL }}
            TRANSCRIPTION_CLOUD_FUNCTION_URL=${{ vars.TRANSCRIPTION_CLOUD_FUNCTION_URL }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
