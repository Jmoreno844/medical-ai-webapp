name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - "cloud_functions/functions/**"
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-east1

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Transcription Function
        run: |
          cd cloud_functions/functions
          gcloud functions deploy transcription-endpoint \
            --gen2 \
            --runtime=python312 \
            --region=${{ env.GCP_REGION }} \
            --source=. \
            --entry-point=transcription_endpoint \
            --trigger-http \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1024MB \
            --timeout=300s \
            --service-account=cloud-functions-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-env-vars GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }},GEMINI_MODEL=gemini-2.0-flash,ENVIRONMENT=test,DJANGO_API_BASE_URL=${{ vars.VITE_API_URL }}

      - name: Deploy Document Workflow Function
        run: |
          cd cloud_functions/functions
          gcloud functions deploy document-workflow \
            --gen2 \
            --runtime=python312 \
            --region=${{ env.GCP_REGION }} \
            --source=. \
            --entry-point=generate_document_workflow \
            --trigger-http \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1024MB \
            --timeout=300s \
            --service-account=cloud-functions-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-env-vars GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }},GEMINI_MODEL=gemini-2.0-flash,ENVIRONMENT=test,DJANGO_API_BASE_URL=${{ vars.VITE_API_URL }}
