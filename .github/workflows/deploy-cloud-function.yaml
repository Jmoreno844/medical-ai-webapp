name: Deploy Cloud Functions

on:
  push:
    branches:
      - main
    paths:
      - "cloud_functions/functions/**"
      - ".github/workflows/deploy-cloud-function.yaml"
  workflow_dispatch:

# Bucket/object must match Terraform: infra/environments/test/terraform.tfvars (cf_source_bucket, cf_source_object)
env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-east1
  CF_SOURCE_BUCKET: ${{ vars.CF_SOURCE_BUCKET }}
  CF_SOURCE_OBJECT: ${{ vars.CF_SOURCE_OBJECT }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Zip source and upload to GCS (for Terraform / reproducible artifact)
        run: |
          set -euo pipefail
          if [ -z "${GCP_PROJECT:-}" ]; then
            echo "::error::Set repository variable GCP_PROJECT_ID (e.g. vex-stg)"
            exit 1
          fi
          BUCKET="${CF_SOURCE_BUCKET:-${GCP_PROJECT}-cf-source}"
          OBJECT="${CF_SOURCE_OBJECT:-cloud-functions.zip}"
          echo "Using gs://${BUCKET}/${OBJECT}"

          if ! gcloud storage buckets describe "gs://${BUCKET}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            echo "Creating bucket gs://${BUCKET}"
            gcloud storage buckets create "gs://${BUCKET}" \
              --location="${GCP_REGION}" \
              --uniform-bucket-level-access \
              --project="${GCP_PROJECT}"
          fi

          TMP_ZIP="$(mktemp /tmp/cf-source-XXXXXX.zip)"
          cd cloud_functions/functions
          zip -r "${TMP_ZIP}" . \
            -x "**/__pycache__/*" \
            -x "**/*.pyc" \
            -x "**/.venv/*" \
            -x "**/.pytest_cache/*" \
            -x "**/.mypy_cache/*"
          cd ../..

          gcloud storage cp "${TMP_ZIP}" "gs://${BUCKET}/${OBJECT}" --project="${GCP_PROJECT}"
          rm -f "${TMP_ZIP}"
          echo "Uploaded Terraform source archive to gs://${BUCKET}/${OBJECT}"

      - name: Deploy Transcription Function
        run: |
          cd cloud_functions/functions
          gcloud functions deploy transcription-endpoint \
            --gen2 \
            --runtime=python312 \
            --region=${{ env.GCP_REGION }} \
            --source=. \
            --entry-point=transcription_endpoint \
            --trigger-http \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1024MB \
            --timeout=300s \
            --service-account=cloud-functions-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-env-vars GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }},GEMINI_MODEL=gemini-2.0-flash,ENVIRONMENT=test,DJANGO_API_BASE_URL=${{ vars.VITE_API_URL }}

      - name: Deploy Document Workflow Function
        run: |
          cd cloud_functions/functions
          gcloud functions deploy document-workflow \
            --gen2 \
            --runtime=python312 \
            --region=${{ env.GCP_REGION }} \
            --source=. \
            --entry-point=generate_document_workflow \
            --trigger-http \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1024MB \
            --timeout=300s \
            --service-account=cloud-functions-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            --set-env-vars GCP_PROJECT=${{ env.GCP_PROJECT }},GCP_REGION=${{ env.GCP_REGION }},GEMINI_MODEL=gemini-2.0-flash,ENVIRONMENT=test,DJANGO_API_BASE_URL=${{ vars.VITE_API_URL }}
