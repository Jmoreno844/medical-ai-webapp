name: stg-document-generation-worker

on:
  push:
    branches:
      - main
    paths:
      - "document_generation_worker/**"
      - ".github/workflows/document-generation-worker-deployment-stg.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "document_generation_worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-document-generation-worker
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: document-generation-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./document_generation_worker
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Tag with latest for caching
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: deploy
""    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-document-generation-worker
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: document-generation-worker

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Document Generation Worker to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --ingress=all
            --no-allow-unauthenticated
            --service-account=document-generation-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=5
            --concurrency=8
            --port=8092
            --timeout=300s
          env_vars: |
            ENVIRONMENT=stg
            PORT=8092
            DOCUMENT_GENERATION_LOG_LEVEL=INFO
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            OTEL_SERVICE_NAME=vexthealth-document-generation-worker
            OTEL_TRACES_SAMPLER_ARG=1.0
            GCP_REGION=${{ env.REGION }}
            BACKEND_INTERNAL_BASE_URL=${{ vars.VITE_API_URL }}
            CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT=cloud-tasks-invoker@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            DOCUMENT_GENERATION_PROVIDER=${{ vars.DOCUMENT_GENERATION_PROVIDER || 'anthropic_api' }}
            DOCUMENT_GENERATION_MODEL=${{ vars.DOCUMENT_GENERATION_MODEL || 'claude-haiku-4-5-20251001' }}
            DOCUMENT_GENERATION_GOOGLE_MODEL=${{ vars.DOCUMENT_GENERATION_GOOGLE_MODEL || 'gemini-3.1-flash-lite-preview' }}
            VERTEX_AI_LOCATION=${{ vars.DOCUMENT_GENERATION_VERTEX_AI_LOCATION || 'global' }}
            LLM_MAX_CONCURRENT=4
            LANGSMITH_TRACING=${{ vars.DOCUMENT_GENERATION_LANGSMITH_TRACING || 'false' }}
            LANGSMITH_PROJECT=${{ vars.LANGSMITH_PROJECT || '' }}
            LANGSMITH_ENDPOINT=${{ vars.LANGSMITH_ENDPOINT || '' }}
          secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:latest
            LANGSMITH_API_KEY=langsmith-api-key:latest
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
