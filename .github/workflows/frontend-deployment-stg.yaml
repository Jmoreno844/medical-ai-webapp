name: stg-webapp

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/frontend-deployment-stg.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-frontend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: webapp-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes in webapp directory or workflow file
        id: check_changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Changes detected due to manual workflow dispatch"
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
            APP_CHANGES=$(echo "$CHANGED_FILES" | grep "^webapp/" || echo "")
            WORKFLOW_CHANGED=$(echo "$CHANGED_FILES" | grep "^.github/workflows/frontend-deployment-stg.yaml$" || echo "")

            if [ -z "$APP_CHANGES" ] && [ -z "$WORKFLOW_CHANGED" ]; then
              echo "No changes in webapp directory or workflow file"
              echo "changes=false" >> $GITHUB_OUTPUT
            else
              echo "changes=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Node.js
        if: steps.check_changes.outputs.changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        if: steps.check_changes.outputs.changes == 'true'
        working-directory: ./webapp
        run: npm ci

      - name: Build frontend
        if: steps.check_changes.outputs.changes == 'true'
        working-directory: ./webapp
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.check_changes.outputs.changes == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        if: steps.check_changes.outputs.changes == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: steps.check_changes.outputs.changes == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push frontend image
        if: steps.check_changes.outputs.changes == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_BASE_URL=/
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max

      - name: Tag with latest for caching
        if: steps.check_changes.outputs.changes == 'true' && github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-frontend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: webapp-frontend

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy frontend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --ingress=all
            --allow-unauthenticated
            --service-account=${{ vars.FRONTEND_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=3
            --concurrency=80
            --port=8080
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
