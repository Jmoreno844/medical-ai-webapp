# Primary staging API: FastAPI.
# Required GitHub Environment `stg` var: FASTAPI_CORS_ALLOWED_ORIGINS (comma-separated
# origins, e.g. the staging SPA URL). Maps to env on Cloud Run.
name: Backend FastAPI Staging Deployment

on:
  push:
    branches:
      - main
    paths:
      - "backend_fastapi/**"
      - ".github/workflows/backend-fastapi-deployment-stg.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "backend_fastapi/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and Push FastAPI Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-backend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: fastapi-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend_fastapi
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Tag with latest for caching
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy FastAPI to Cloud Run
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-backend
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: fastapi-backend

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve service URLs
        id: function_urls
        run: |
          set -euo pipefail
          DB_IAM_USER="${{ vars.BACKEND_SERVICE_ACCOUNT }}"
          DB_IAM_USER="${DB_IAM_USER%.gserviceaccount.com}"
          BACKEND_URL="$(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --format='value(status.url)')"
          COPILOT_URL="$(gcloud run services describe vexthealth-copilot-agent --region="${REGION}" --format='value(status.url)')"
          TRANSCRIPTION_WORKER_URL="$(gcloud run services describe vexthealth-transcription-worker --region="${REGION}" --format='value(status.url)')"
          DOCUMENT_GENERATION_WORKER_URL="$(gcloud run services describe vexthealth-document-generation-worker --region="${REGION}" --format='value(status.url)')"
          echo "db_iam_user=${DB_IAM_USER}" >> "$GITHUB_OUTPUT"
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "copilot_url=${COPILOT_URL}" >> "$GITHUB_OUTPUT"
          echo "transcription_worker_url=${TRANSCRIPTION_WORKER_URL}" >> "$GITHUB_OUTPUT"
          echo "document_generation_worker_url=${DOCUMENT_GENERATION_WORKER_URL}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --ingress=all
            --allow-unauthenticated
            --session-affinity
            --service-account=${{ vars.BACKEND_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=1
            --concurrency=250
          env_vars: |
            ENVIRONMENT=stg
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GCP_PROJECT=${{ env.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            FASTAPI_COOKIE_SECURE=true
            DB_HOST=127.0.0.1
            DB_PORT=5432
            DB_NAME=${{ env.GCP_PROJECT_ID }}
            DB_USER=${{ steps.function_urls.outputs.db_iam_user }}
            CLOUD_TASKS_REGION=${{ env.REGION }}
            TRANSCRIPTION_QUEUE_NAME=audio-transcription-queue-stg
            DOCUMENT_GENERATION_QUEUE_NAME=document-generation-queue-stg
            CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT=cloud-tasks-invoker@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            TRANSCRIPTION_TASK_TARGET_URL=${{ steps.function_urls.outputs.transcription_worker_url }}/api/v1/internal/transcription/tasks
            TRANSCRIPTION_WORKER_SERVICE_ACCOUNT=transcription-worker-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            DOCUMENT_GENERATION_TASK_TARGET_URL=${{ steps.function_urls.outputs.document_generation_worker_url }}/api/v1/internal/document-generation/tasks
            DOCUMENT_GENERATION_WORKER_SERVICE_ACCOUNT=document-generation-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            DOCUMENT_GENERATION_GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite-preview' }}
            COPILOT_AGENT_BASE_URL=${{ steps.function_urls.outputs.copilot_url }}
            FASTAPI_CORS_ALLOWED_ORIGINS=${{ vars.FASTAPI_CORS_ALLOWED_ORIGINS }}
          secrets: |
            JWT_SECRET_KEY=jwt-secret-key:latest
            COPILOT_SERVICE_SHARED_JWT=copilot-service-shared-jwt:latest
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
