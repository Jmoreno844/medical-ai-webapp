name: stg-transcription-worker

on:
  push:
    branches:
      - main
    paths:
      - "transcription_worker/**"
      - ".github/workflows/transcription-worker-deployment-stg.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "transcription_worker/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-transcription-worker
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: transcription-worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./transcription_worker
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Tag with latest for caching
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: stg
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SERVICE_NAME: vexthealth-transcription-worker
      REGION: us-east1
      REPOSITORY: vexthealth-containers
      IMAGE_NAME: transcription-worker

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOYER_SA }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Transcription Worker to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --ingress=all
            --no-allow-unauthenticated
            --service-account=transcription-worker-runner@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --cpu=2
            --memory=1Gi
            --min-instances=0
            --max-instances=5
            --concurrency=8
            --port=8091
            --timeout=300s
          env_vars: |
            ENVIRONMENT=stg
            TRANSCRIPTION_WORKER_LOG_LEVEL=INFO
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            OTEL_SERVICE_NAME=vexthealth-transcription-worker
            OTEL_TRACES_SAMPLER_ARG=1.0
            GCP_REGION=${{ env.REGION }}
            GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}
            BACKEND_INTERNAL_BASE_URL=${{ vars.VITE_API_URL }}
            CLOUD_TASKS_INVOKER_SERVICE_ACCOUNT=cloud-tasks-invoker@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            TRANSCRIPTION_GEMINI_MODEL=${{ vars.TRANSCRIPTION_GEMINI_MODEL || 'gemini-2.5-flash' }}
            VERTEX_AI_LOCATION=global
            ORT_INTRA_OP_NUM_THREADS=1
            VAD_MAX_CONCURRENT=1
            GEMINI_MAX_CONCURRENT=4
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
