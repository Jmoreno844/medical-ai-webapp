version: "3.8"

services:
  transcription_service: # Renamed service
    build:
      context: ./transcribe_audio_save_db
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ENVIRONMENT=local
      - GEMINI_MODEL=gemini-2.0-flash
      - FUNCTION_TARGET=transcription_endpoint
      - PORT=8082 # Explicitly set port
    env_file:
      - ./transcribe_audio_save_db/.env.local
    volumes:
      - ./credentials:/app/credentials:ro
    network_mode: "host"

  documentation_generation_service: # Renamed service
    build:
      context: ./transcribe_audio_save_db
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ENVIRONMENT=local
      - FUNCTION_TARGET=document_generation_endpoint
      - PORT=8083 # Different port here
    env_file:
      - ./transcribe_audio_save_db/.env.local
    volumes:
      - ./credentials:/app/credentials:ro
    network_mode: "host"
