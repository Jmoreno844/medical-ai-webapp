version: "3.8"

# Local GCP auth: mount Application Default Credentials from the host
# (`gcloud auth application-default login`). Overrides any GOOGLE_APPLICATION_CREDENTIALS
# in env_file. Optional: ./credentials for a service account JSON if your org allows keys.

services:
  transcription_service: # Renamed service
    build:
      context: ./functions
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ENVIRONMENT=local
      - GCP_PROJECT=vext-stg # Added GCP project ID
      - GOOGLE_CLOUD_PROJECT=vext-stg
      - GCP_REGION=us-east1 # Added GCP region
      - FUNCTION_TARGET=transcription_endpoint
      - PORT=8082 # Explicitly set port
      - GOOGLE_APPLICATION_CREDENTIALS=/app/adc.json
      - BACKEND_API_BASE_URL=http://localhost:8001
      - BACKEND_API_VERSION=v1
    env_file:
      - ./functions/.env.local
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/adc.json:ro
      - ./credentials:/app/credentials:ro
    network_mode: "host"
