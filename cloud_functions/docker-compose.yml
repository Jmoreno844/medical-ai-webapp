version: "3.8"

services:
  transcription_service: # Renamed service
    build:
      context: ./functions
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ENVIRONMENT=local
      - GEMINI_MODEL=gemini-2.0-flash
      - GCP_PROJECT=vex-stg # Added GCP project ID
      - GCP_REGION=us-east1 # Added GCP region
      - FUNCTION_TARGET=transcription_endpoint
      - PORT=8082 # Explicitly set port
    env_file:
      - ./functions/.env.local
    volumes:
      - ./credentials:/app/credentials:ro
    network_mode: "host"

  documentation_generation_service: # Renamed service
    build:
      context: ./functions
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ENVIRONMENT=local
      - GEMINI_MODEL=gemini-2.0-flash # Added missing GEMINI_MODEL
      - GCP_PROJECT=vex-stg # Added GCP project ID
      - GCP_REGION=us-east1 # Added GCP region
      - FUNCTION_TARGET=generate_document_workflow
      - PORT=8083 # Different port here
    env_file:
      - ./functions/.env.local
    volumes:
      - ./credentials:/app/credentials:ro
    network_mode: "host"
