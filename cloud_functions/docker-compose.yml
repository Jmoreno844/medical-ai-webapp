version: "3.8"

services:
  transcribe_audio_save_db:
    build:
      context: ./transcribe_audio_save_db
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ENVIRONMENT=local
    env_file:
      - ./transcribe_audio_save_db/.env.local
    volumes:
      - ./credentials:/app/credentials:ro
    # Use host network mode for Linux
    network_mode: "host"
    # Remove or comment out these when using host network mode
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # networks:
    #   - cloud-function-network
# Remove or comment out this when using host network mode
# networks:
#   cloud-function-network:
#     driver: bridge
