version: "3.8"

services:
  web:
    build: .
    command: sh -c "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:${BACKEND_PORT:-8001}"
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG}
      # Explicit settings module for local Docker (do not rely on manage.py default alone).
      - DJANGO_SETTINGS_MODULE=config.settings.develop
      # develop.py accepts DJANGO_SECRET_KEY or legacy SECRET_KEY from .env.
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      # Inside Compose, Postgres is the service name `db` (not localhost from host .env).
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5433}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${DB_PORT:-5433}
    depends_on:
      db:
        condition: service_healthy

  # Primary local API: Alembic in entrypoint bootstraps schema (no Django migrate required on empty DB).
  # Start: `docker compose --profile fastapi up -d --build web_fastapi db` (do not also run `web` on 8001).
  web_fastapi:
    profiles: ["fastapi"]
    build:
      context: ../backend_fastapi
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8080"
    environment:
      - DEBUG=${DEBUG:-true}
      - ENVIRONMENT=local
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5433}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    command: postgres -p ${DB_PORT:-5433}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - "${DB_PORT:-5433}:${DB_PORT:-5433}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${DB_PORT:-5433}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${DB_PORT:-5433}
      - DB_PORT=${DB_PORT:-5433}
      - DJANGO_SETTINGS_MODULE=config.settings.test
    command: ["-v", "--no-migrations", "."]

volumes:
  postgres_data:
