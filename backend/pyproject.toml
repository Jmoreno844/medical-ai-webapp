[project]
name = "backend"
version = "0.1.0"
description = "Django Ninja medical API"
authors = [{ name = "jmoreno84417", email = "jmoreno84417@gitlab.com" }]
requires-python = ">=3.10"
dependencies = [
  "django>=5.1.6,<5.2",
  "django-ninja>=1.3.0,<1.4",
  "psycopg2-binary>=2.9.10,<3",
  "gunicorn>=22.0.0,<26",
  "uvicorn>=0.34.0,<0.35",
  "python-dotenv>=1.0.1,<2",
  "pyjwt>=2.10.1,<3",
  "django-cors-headers>=4.7.0,<5",
  "vertexai>=1.71.1,<2",
  "django-ninja-jwt>=5.3.5,<6",
  "google-cloud-secret-manager>=2.23.1,<3",
  "google-cloud-tasks>=2.19.3,<3",
  "django-silk>=5.3.2,<6",
  "python-json-logger>=3.3.0,<4",
  "opentelemetry-api>=1.27.0,<2",
  "opentelemetry-sdk>=1.27.0,<2",
  "opentelemetry-instrumentation-django>=0.48b0,<0.60",
  "opentelemetry-instrumentation-requests>=0.48b0,<0.60",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
  "opentelemetry-exporter-gcp-trace>=1.7.0,<2",
]

[dependency-groups]
dev = [
  "pre-commit>=4.1.0,<5",
  "ruff>=0.9.6,<0.10",
  "pytest>=8.3.4,<9",
  "pytest-django>=4.10.0,<5",
  "black>=25.1.0,<26",
  "pip-audit>=2.9.0,<3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py310"
