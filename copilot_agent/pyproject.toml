[project]
name = "copilot-agent"
version = "0.1.0"
description = "Dedicated LangGraph-based copilot runtime for Proyecto AI Medico"
authors = [{ name = "jmoreno84417", email = "jmoreno84417@gitlab.com" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.34.0,<0.35",
  "langgraph>=1.1.4,<2",
  "langgraph-checkpoint-postgres>=2.0.0,<3",
  "langchain-core>=1.2.25,<2",
  "psycopg[binary]>=3.2.0,<4",
  "python-dotenv>=1.0.1,<2",
  "python-json-logger>=3.3.0,<4",
  "pydantic-settings>=2.8.0,<3",
  "pyjwt>=2.10.1,<3",
  "httpx>=0.28.0,<0.29",
  "langchain-google-genai>=4.2.1,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "ruff>=0.9.6,<0.10",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py311"
