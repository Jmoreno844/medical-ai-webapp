[tool.poetry]
name = "django-ninja-project"
version = "0.1.0"
description = ""
authors = ["jmoreno84417 <jmoreno84417@gitlab.com>"]
packages = [{include = "django_ninja_project", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.1.6"
django-ninja = "^1.3.0"
psycopg2 = "^2.9.10"
uvicorn = "^0.34.0"
python-dotenv = "^1.0.1"
pyjwt = ">=2.10.1,<3.0.0"
django-cors-headers = ">=4.7.0,<5.0.0"
vertexai = ">=1.71.1,<2.0.0"
django-ninja-jwt = ">=5.3.5,<6.0.0"
google-cloud-secret-manager = ">=2.23.1,<3.0.0"
django-silk = ">=5.3.2,<6.0.0"
python-json-logger = ">=3.3.0,<4.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
ruff = "^0.9.6"
pytest = "^8.3.4"
pytest-django = "^4.10.0"
black = "^25.1.0"
pip-audit = "^2.9.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"