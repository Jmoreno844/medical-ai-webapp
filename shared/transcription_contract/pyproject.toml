[project]
name = "transcription-contract"
version = "0.1.0"
description = "Shared structured transcription contract for worker and backend"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["transcription_contract*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
