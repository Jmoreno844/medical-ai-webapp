[project]
name = "document-pipeline-core"
version = "0.1.0"
description = "Shared clinical document pipeline logic for production worker and R&D harness"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49.0,<1",
  "google-genai>=1.16.0,<2",
  "groq>=0.22.0,<1",
  "openai>=1.99.9,<3",
  "pydantic>=2.10.0,<3",
  "python-dotenv>=1.0.1,<2",
  "tiktoken>=0.9.0,<1",
  "pdfplumber>=0.11.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4,<9",
  "ruff>=0.9.6,<0.10",
  "reportlab>=4.2.0,<5",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["document_pipeline_core*"]

[tool.setuptools.package-data]
document_pipeline_core = ["../templates/*.json"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
